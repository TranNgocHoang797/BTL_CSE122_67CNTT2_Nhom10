<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng nhập · SmartShelf RetailTech OS</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
  <style>
    body {
      background: linear-gradient(135deg, #f8fafc 0%, #ecfdf5 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }
    .login-container {
      width: 100%;
      max-width: 520px;
      background-color: var(--bg-card);
      border: 1px solid var(--border-light);
      border-radius: var(--radius-xl);
      box-shadow: var(--shadow-xl);
      padding: 36px;
    }
    .role-quick-btn {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 14px;
      border: 1px solid var(--border-light);
      border-radius: var(--radius-md);
      background-color: var(--bg-card);
      cursor: pointer;
      transition: all 0.15s ease;
      text-align: left;
      width: 100%;
    }
    .role-quick-btn:hover {
      border-color: var(--primary);
      background-color: var(--primary-light);
      transform: translateY(-2px);
      box-shadow: var(--shadow-sm);
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div style="text-align: center; margin-bottom: 28px;">
      <div style="width: 52px; height: 52px; border-radius: var(--radius-lg); background: linear-gradient(135deg, #059669 0%, #0d9488 100%); display: inline-flex; align-items: center; justify-content: center; font-size: 1.6rem; color: white; box-shadow: 0 6px 16px rgba(5, 150, 105, 0.3); margin-bottom: 12px;">
        🛒
      </div>
      <h1 style="font-size: 1.6rem; font-weight: 800; color: var(--text-main); margin-bottom: 6px;">Đăng nhập SmartShelf OS</h1>
      <p style="font-size: 0.88rem; color: var(--text-muted);">Hệ thống điều hành kệ hàng và hỗ trợ mua sắm thông minh</p>
    </div>

    <!-- Quick Role Switcher Buttons for Grading & Testing -->
    <div style="margin-bottom: 24px;">
      <div style="font-size: 0.78rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 10px;">
        Đăng nhập nhanh 1-Click theo vai trò kiểm thử:
      </div>
      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
        <button class="role-quick-btn" onclick="quickLogin('shopper')">
          <span style="font-size: 1.3rem;">🛍️</span>
          <div>
            <strong style="font-size: 0.85rem; color: var(--text-main); display: block;">Khách mua sắm</strong>
            <span style="font-size: 0.72rem; color: var(--text-muted);">Trịnh Kim Ngân</span>
          </div>
        </button>

        <button class="role-quick-btn" onclick="quickLogin('associate')">
          <span style="font-size: 1.3rem;">🧑‍💼</span>
          <div>
            <strong style="font-size: 0.85rem; color: var(--text-main); display: block;">Nhân viên cửa hàng</strong>
            <span style="font-size: 0.72rem; color: var(--text-muted);">Lê Văn Tùng (Khu A)</span>
          </div>
        </button>

        <button class="role-quick-btn" onclick="quickLogin('manager')">
          <span style="font-size: 1.3rem;">📊</span>
          <div>
            <strong style="font-size: 0.85rem; color: var(--text-main); display: block;">Quản lý cửa hàng</strong>
            <span style="font-size: 0.72rem; color: var(--text-muted);">Trần Minh Quản</span>
          </div>
        </button>

        <button class="role-quick-btn" onclick="quickLogin('admin')">
          <span style="font-size: 1.3rem;">⚙️</span>
          <div>
            <strong style="font-size: 0.85rem; color: var(--text-main); display: block;">Quản trị viên</strong>
            <span style="font-size: 0.72rem; color: var(--text-muted);">Hoàng Anh Tuấn</span>
          </div>
        </button>
      </div>
    </div>

    <div style="display: flex; align-items: center; gap: 12px; margin-bottom: 24px;">
      <div style="flex: 1; height: 1px; background-color: var(--border-light);"></div>
      <span style="font-size: 0.78rem; color: var(--text-muted); text-transform: uppercase;">Hoặc nhập tài khoản</span>
      <div style="flex: 1; height: 1px; background-color: var(--border-light);"></div>
    </div>

    <!-- Login Form -->
    <form id="login-form" onsubmit="handleFormLogin(event)">
      <div class="form-group">
        <label class="form-label">Tên đăng nhập hoặc Email:</label>
        <input type="text" class="form-control" id="login-username" value="quan.tm" placeholder="quan.tm@smartshelf.vn" required>
      </div>
      <div class="form-group">
        <div style="display:flex;justify-content:space-between;align-items:center">
          <label class="form-label">Mật khẩu truy cập:</label>
          <a href="#" onclick="alert('Tính năng đổi mật khẩu đang trong chế độ demo. Bạn có thể sử dụng các nút Đăng nhập nhanh 1-Click phía trên!'); return false;" style="font-size:0.75rem">Quên mật khẩu?</a>
        </div>
        <input type="password" class="form-control" id="login-password" value="••••••••" required>
      </div>
      <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 8px;">
        Đăng nhập hệ thống
      </button>
    </form>

    <div style="margin-top: 24px; text-align: center;">
      <a href="index.html" style="font-size: 0.85rem; color: var(--text-muted);">← Quay lại Cổng thông tin tổng quan</a>
    </div>
  </div>

  <div id="toast-container" class="toast-container"></div>

  <!-- Scripts -->
  <script src="js/data.js"></script>
  <script src="js/store.js"></script>
  <script src="js/ai.js"></script>
  <script src="js/app.js"></script>
  <script>
    function quickLogin(role) {
      SS_Store.setCurrentRole(role);
      const roleHomePages = {
        shopper: 'shopper-product-search.html',
        associate: 'associate-zone-view.html',
        manager: 'manager-store-dashboard.html',
        admin: 'admin-product-management.html'
      };
      SS_App.toast(`Đăng nhập thành công với vai trò ${SS_App.getRoleVietnameseName(role)}!`, 'success');
      setTimeout(() => {
        window.location.href = roleHomePages[role];
      }, 500);
    }

    function handleFormLogin(e) {
      e.preventDefault();
      const val = document.getElementById('login-username').value.trim();
      const user = SS_Store.all('users').find(u => u.username === val || u.email === val) || SS_Store.all('users')[0];

      SS_Store.setCurrentUser(user);
      quickLogin(user.role);
    }
  </script>
</body>
</html>
