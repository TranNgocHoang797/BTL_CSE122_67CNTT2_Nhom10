<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trung tâm thông báo & Cảnh báo · SmartShelf</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
  <style>
    .notif-page-item {
      background-color: var(--bg-card);
      border: 1px solid var(--border-light);
      border-radius: var(--radius-lg);
      padding: 16px 20px;
      margin-bottom: 12px;
      display: flex;
      align-items: flex-start;
      gap: 16px;
      box-shadow: var(--shadow-xs);
      transition: all 0.2s ease;
      cursor: pointer;
    }
    .notif-page-item:hover {
      box-shadow: var(--shadow-md);
      transform: translateY(-1px);
    }
    .notif-page-item.unread {
      border-left: 4px solid var(--primary);
      background: linear-gradient(90deg, #f0fdf4 0%, #ffffff 100%);
    }
  </style>
</head>
<body>
  <!-- Sidebar -->
  <div id="sidebar-slot"></div>

  <div class="ss-app-container">
    <!-- Header -->
    <div id="header-slot"></div>

    <main class="ss-main-workspace">
      <!-- Page Header -->
      <div class="ss-page-head">
        <div class="ss-page-title-box">
          <h1>Trung tâm thông báo &amp; Cảnh báo hệ thống (Notification Hub)</h1>
          <p class="ss-page-subtitle">Theo dõi các biến động vận hành thời gian thực: Cảnh báo dị thường AI, lệnh bổ sung hàng quá hạn và kết quả kiểm kê kệ hàng.</p>
        </div>
        <div class="ss-page-actions">
          <button class="btn btn-secondary" onclick="markAllRead()">
            <span>✓</span>
            <span>Đánh dấu tất cả là đã đọc</span>
          </button>
        </div>
      </div>

      <!-- Filter Tabs -->
      <div class="category-tabs" style="margin-bottom: 20px;">
        <button class="category-tab active" onclick="filterNotifs('all', this)">Tất cả thông báo</button>
        <button class="category-tab" onclick="filterNotifs('ai_alert', this)">🚨 Cảnh báo dị thường AI</button>
        <button class="category-tab" onclick="filterNotifs('restock', this)">📦 Nhiệm vụ Restock</button>
        <button class="category-tab" onclick="filterNotifs('shelf_check', this)">📋 Phiếu kiểm kê kệ</button>
        <button class="category-tab" onclick="filterNotifs('system', this)">⚙️ Hệ thống</button>
      </div>

      <!-- Notifications List -->
      <div id="notifications-list-container">
        <!-- Rendered by JS -->
      </div>
    </main>
  </div>

  <!-- Scripts -->
  <script src="js/data.js"></script>
  <script src="js/store.js"></script>
  <script src="js/ai.js"></script>
  <script src="js/app.js"></script>
  <script>
    let activeFilter = 'all';

    document.addEventListener('DOMContentLoaded', () => {
      renderNotifications();
    });

    function filterNotifs(type, btn) {
      activeFilter = type;
      document.querySelectorAll('.category-tab').forEach(b => b.classList.remove('active'));
      if (btn) btn.classList.add('active');
      renderNotifications();
    }

    function renderNotifications() {
      const container = document.getElementById('notifications-list-container');
      let notifs = SS_Store.all('notifications') || [];

      if (activeFilter !== 'all') {
        notifs = notifs.filter(n => n.type === activeFilter);
      }

      if (!notifs.length) {
        container.innerHTML = `
          <div class="card card-pad state-empty">
            <div class="state-empty-icon">🔔</div>
            <div class="state-empty-title">Không có thông báo nào</div>
            <div class="state-empty-desc">Tất cả thông báo trong danh mục này đã được xử lý.</div>
          </div>
        `;
        return;
      }

      container.innerHTML = notifs.map(n => {
        let icon = '🔔';
        let iconBg = '#f1f5f9';
        let iconColor = '#0f172a';

        if (n.type === 'ai_alert') {
          icon = '🚨';
          iconBg = '#fef2f2';
          iconColor = '#dc2626';
        } else if (n.type === 'restock') {
          icon = '⚡';
          iconBg = '#fffbeb';
          iconColor = '#d97706';
        } else if (n.type === 'shelf_check') {
          icon = '📋';
          iconBg = '#ecfdf5';
          iconColor = '#059669';
        }

        return `
          <div class="notif-page-item ${!n.read ? 'unread' : ''}" onclick="openNotifAction('${n.id}', '${n.actionUrl}')">
            <div style="width:44px;height:44px;border-radius:50%;background:${iconBg};color:${iconColor};display:flex;align-items:center;justify-content:center;font-size:1.25rem;flex-shrink:0">
              ${icon}
            </div>
            <div style="flex:1">
              <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:4px">
                <strong style="font-size:0.95rem;color:var(--text-main)">${n.title}</strong>
                <span style="font-size:0.75rem;color:var(--text-muted)">${n.time}</span>
              </div>
              <p style="font-size:0.85rem;color:var(--text-secondary);margin:0 0 8px;line-height:1.4">${n.content}</p>
              <div style="display:flex;gap:8px">
                <span class="btn btn-secondary btn-sm" style="font-size:0.75rem">Xem chi tiết điều phối →</span>
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    function openNotifAction(id, actionUrl) {
      SS_Store.update('notifications', id, { read: true });
      if (actionUrl) {
        window.location.href = actionUrl;
      } else {
        renderNotifications();
      }
    }

    function markAllRead() {
      SS_Store.markAllNotificationsAsRead();
      SS_App.toast('Đã đánh dấu tất cả thông báo là đã đọc!', 'success');
      renderNotifications();
    }
  </script>
</body>
</html>
